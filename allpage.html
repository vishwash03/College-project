<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebars</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --content-offset: 112px;
      --header-top: 24px;
      --header-height: 160px;
      --header-clearance: 12px;
      scroll-padding-top: calc(var(--header-top) + var(--header-height) + var(--header-clearance));
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #3a3330;
      transition: background 0.3s;
    }

    .main-content {
      width: calc(100% - var(--content-offset));
      margin-left: var(--content-offset);
      min-height: 100vh;
      padding: calc(var(--header-top) + var(--header-height)) 0 32px;
    }

    .content {
      width: 100%;
    }

    .header {
      position: fixed;
      top: var(--header-top);
      left: var(--content-offset);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: var(--header-height);
      width: calc(100vw - var(--content-offset) - 24px);
      padding: 4px 24px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    body:has(.sidebar:not(.collapsed)) {
      --content-offset: 298px;
    }

    .header h1 {
      margin: 0;
      color: #3a3330;
      font-size: 28px;
      font-weight: 700;
    }

    .header-logo {
      display: block;
      width: min(160px, 100%);
      height: auto;
      max-height: 60px;
      margin: 0 auto;
    }

    .header h4 {
      margin: 4px 0 0;
      color: #8b7b77;
      font-size: 15px;
      font-weight: 500;
    }

    .header .divider {
      width: 100%;
      margin: 14px 0 8px;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      height: 40px;
      min-height: 40px;
      flex: 0 0 40px;
      overflow-x: auto;
      padding: 0 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .nav-tabs::-webkit-scrollbar-track {
      background: #f5e6d3;
      border-radius: 999px;
    }

    .nav-tabs::-webkit-scrollbar-thumb {
      background: #be8282;
      border-radius: 999px;
    }

    .nav-tabs a {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-right: 1px solid #e8d4c8;
      border-radius: 8px;
      color: #8b7b77;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }

    .nav-tabs a:focus-visible {
      outline: 2px solid #8b5563;
      outline-offset: -2px;
    }

    .nav-tabs a:hover,
    .nav-tabs a.active {
      background: #f1e4d3;
      color: #3a3330;
    }

    .nav-tabs a:last-child {
      border-right: 0;
    }

    @media (max-width: 700px) {
      :root {
        --content-offset: 80px;
        --header-top: 12px;
      }

      body:has(.sidebar:not(.collapsed)) {
        --content-offset: 80px;
      }

      .sidebar,
      .sidebar:not(.collapsed) {
        top: 12px;
        left: 12px;
        width: 56px;
        margin: 0;
      }

      .sidebar .nav button span,
      .sidebar .profile-name {
        display: none;
      }

      .sidebar .nav button,
      .sidebar .profile-button {
        justify-content: center;
        padding: 0;
      }

      .main-content {
        width: calc(100% - var(--content-offset));
        margin-left: var(--content-offset);
        padding: calc(var(--header-top) + var(--header-height)) 0 24px;
      }

      .header {
        padding: 4px 10px;
      }

      .header h1 {
        font-size: 22px;
      }

      .header h4 {
        font-size: 12px;
      }

      .header .divider {
        margin: 8px 0 6px;
      }

      .nav-tabs a {
        padding: 5px 8px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      :root {
        --content-offset: 68px;
      }

      body:has(.sidebar:not(.collapsed)) {
        --content-offset: 68px;
      }

      .sidebar,
      .sidebar:not(.collapsed) {
        left: 8px;
        width: 48px;
      }
    }

    .sidebar {
      position: fixed;
      z-index: 2;
      width: 250px;
      top: 24px;
      left: 24px;
      bottom: 32px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition:
        width 0.35s ease,
        background 0.3s,
        box-shadow 0.3s;
    }

    .sidebar.collapsed {
      width: 64px;
    }

    .sidebar-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 8px;
      overflow: hidden;
    }

    /* Header */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      margin-bottom: 16px;
    }

    .collapse-btn {
      position: absolute;
      top: 12px;
      right: 8px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: #be8282;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .collapse-btn:hover {
      background: #a0636b;
    }

    .nav {
      list-style: none;
      margin: 0 0 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;

      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 14px;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #3a3330;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav button span:not(.app-icon) {
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav button:hover {
      background: #f5e6d3;
    }

    .nav button.active {
      background: #f1e4d3;
    }

    /* Divider */
    .divider {
      height: 1px;
      border: 0;
      margin: 10px 4px 14px;
      background: #e8d4c8;
    }

    /* App icons */
    .app-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin: 0 -3px;
      border-radius: 8px;
      background: #fafaf8;
    }

    .app-icon svg {
      width: 18px;
      height: 18px;
    }

    .app-icon-dark {
      background: #3a3330;
    }

    .profile-section {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #e8d4c8;
    }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 12px;
      background: transparent;
      color: #3a3330;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .profile-button:hover {
      background: #f5e6d3;
    }

    .profile-button.active {
      background: #f1e4d3;
    }

    .profile-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #be8282;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .profile-avatar .lucide {
      width: 18px;
      height: 18px;
    }

    .sidebar.collapsed .profile-button {
      justify-content: center;
      padding: 0;
    }

    .sidebar.collapsed .profile-name {
      display: none;
    }

    /* Lucide icon sizing */
    .sidebar .lucide {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }
  </style>
  <link rel="stylesheet" href="site-sidebar.css">
</head>

<body>
  <!-- This is sidebar like(nav bar) -->
  <aside class="sidebar collapsed">
    <div class="sidebar-inner">
      <header class="sidebar-header">
        <button type="button" class="collapse-btn" id="collapseBtn" aria-label="Toggle sidebar">
          <i data-lucide="panel-left"></i>
        </button>
      </header>

      <ul class="nav">
        <li>
          <button type="button" class="active">
            <i data-lucide="house"></i>
            <span>HOME</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="login.html">
            <i data-lucide="search"></i>
            <span>Search</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="OTP.html">
            <i data-lucide="compass"></i>
            <span>Categories</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="cart.html">
            <i data-lucide="shopping-cart"></i>
            <span>Cart</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="wallet.html ">
            <i data-lucide="wallet"></i>
            <span>Wallet</span>
          </button>
        </li>
      </ul>

      <hr class="divider" />

      <ul class="nav apps">
        <li>
          <button type="button" data-page="help.html">
            <i data-lucide="help-circle"></i>
            <span>help & Support</span>
          </button>
        </li>


      </ul>

      <div class="profile-section">
        <button type="button" class="profile-button" aria-label="Open profile">
          <span class="profile-avatar"><i data-lucide="user-round" aria-hidden="true"></i></span>
          <span class="profile-name">Profile</span>
        </button>
      </div>

    </div>
  </aside>
  <main class="main-content">
    <div class="content">
      <div class="header">
        <h1><img class="header-logo" src="logo/sameep-animated.svg" alt="Sameep / समीप"></h1>
        <h4>Location:------------</h4>
        <hr class="divider" />
        <nav class="nav-tabs">
          <a href="index.html" class="active">🛍️ All</a>
          <a href="cafe.html">☕ Cafe</a>
          <a href="index.html">🏠 Home</a>
          <a href="toys.html">🎮 Toys</a>
          <a href="fresh.html">🥬 Fresh</a>
          <a href="electronics.html">🎧 Electronics</a>
          <a href="mobiles.html">📱 Mobiles</a>
          <a href="beauty.html">💄 Beauty</a>
          <a href="fashion.html">👗 Fashion</a>
        </nav>
      </div>

    </div>
  </main>
  <script>
    const sidebar = document.querySelector(".sidebar");
    const collapseBtn = document.getElementById("collapseBtn");

    collapseBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });

    document.querySelectorAll(".nav button").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveButton(button);

        const page = button.dataset.page;
        if (page) {
          window.location.href = page;
        }
      });
    });

    function setActiveButton(button) {
      document
        .querySelectorAll(".nav button, .profile-button")
        .forEach((item) => {
          item.classList.remove("active");
          item.removeAttribute("aria-current");
        });
      button.classList.add("active");
      button.setAttribute("aria-current", "page");
    }

    document.querySelector(".profile-button").addEventListener("click", (event) => {
      setActiveButton(event.currentTarget);
    });

    lucide.createIcons();
  </script>
  <script src="site-sidebar.js"></script>
</body>

</html>
