<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Code</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .link-box {
            background: #ffffff;
            border: 1px solid #e8d4c8;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 24px 32px;
            text-align: center;
        }

        a {
            color: #be8282;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="link-box">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">Open GitHub Code</a>
    </div>
</body>
</html>
