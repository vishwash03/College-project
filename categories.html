<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Categories</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 24px;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
      color: #3a3330;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .sidebar {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      flex: 0 0 250px;
      width: 250px;
      height: calc(100vh - 48px);
      min-height: 420px;
      padding: 18px 8px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition: width 0.35s ease, flex-basis 0.35s ease;
    }

    .sidebar.collapsed {
      flex-basis: 64px;
      width: 64px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      margin: 0 4px 16px;
    }

    .sidebar-title {
      margin: 0 0 0 8px;
      color: #8b5563;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
    }

    .collapse-btn {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 11px;
      background: #be8282;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .collapse-btn:hover {
      background: #a0636b;
    }

    .collapse-btn .lucide {
      width: 22px;
      height: 22px;
    }

    .sidebar-nav {
      display: grid;
      gap: 6px;
      margin: 0;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: 13px;
      color: #3a3330;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      transition: background 0.2s, padding 0.35s;
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      background: #f1e4d3;
    }

    .sidebar-nav i {
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .sidebar-divider {
      height: 1px;
      margin: 10px 4px 14px;
      border: 0;
      background: #e8d4c8;
    }

    .profile-section {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #e8d4c8;
    }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: #3a3330;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      transition: background 0.2s;
    }

    .profile-button:hover,
    .sidebar.collapsed .profile-button:hover {
      background: #f5e6d3;
    }

    .profile-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #be8282;
      color: #ffffff;
    }

    .profile-avatar .lucide {
      width: 18px;
      height: 18px;
    }

    .sidebar.collapsed .profile-button {
      justify-content: center;
      padding: 0;
    }

    .sidebar.collapsed .profile-name {
      display: none;
    }

    .sidebar.collapsed .sidebar-header {
      justify-content: center;
      margin-right: 0;
      margin-left: 0;
    }

    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .sidebar-nav span {
      display: none;
    }

    .sidebar.collapsed .sidebar-nav a {
      justify-content: center;
      padding: 0;
    }

    .sidebar.collapsed .sidebar-divider {
      margin-right: 8px;
      margin-left: 8px;
    }

    main {
      flex: 1 1 auto;
      min-width: 0;
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    .explore-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 160px;
      padding: 4px 24px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .explore-logo {
      display: block;
      width: min(160px, 100%);
      height: auto;
      max-height: 60px;
      margin: 0 auto;
    }

    .explore-divider {
      width: 100%;
      margin: 14px 0 8px;
    }

    .explore-header h1 {
      width: 100%;
      margin: 0;
      color: #3a3330;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .explore-title {
      color: #3a3330;
      text-decoration: none;
    }

    .github-link {
      position: absolute;
      top: 12px;
      right: 14px;
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid #e8d4c8;
      border-radius: 7px;
      background: #f8f1e9;
      color: #5c4d49;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .github-link:hover {
      background: #f1e4d3;
    }

    @media (max-width: 600px) {
      body {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px;
      }

      .sidebar,
      .sidebar.collapsed {
        position: sticky;
        top: 12px;
        flex: 0 0 56px;
        width: 56px;
        height: calc(100vh - 24px);
        min-height: 0;
        padding: 12px 5px;
      }

      main {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        margin: 0;
      }

      .sidebar-header {
        justify-content: center;
        margin: 0 0 12px;
      }

      .sidebar-title,
      .sidebar-nav span,
      .profile-name {
        display: none;
      }

      .sidebar-nav a {
        justify-content: center;
        height: 44px;
        padding: 0;
      }

      .collapse-btn {
        display: none;
      }

      .sidebar-divider {
        margin: 8px 2px;
      }

      .explore-header {
        width: calc(100vw - 104px);
        height: 160px;
        padding: 8px 10px;
      }

      .explore-logo {
        width: min(160px, 100%);
      }

      .explore-header h1 {
        font-size: 22px;
      }

      .github-link {
        top: 8px;
        right: 8px;
        padding: 4px 6px;
        font-size: 11px;
      }

    }
  </style>
  <link rel="stylesheet" href="site-sidebar.css">
</head>

<body>
  <aside class="sidebar collapsed" aria-label="Main navigation">
    <header class="sidebar-header">
      <div class="sidebar-title">Shop</div>
      <button type="button" class="collapse-btn" id="collapseBtn" aria-label="Expand sidebar" aria-expanded="false">
        <i data-lucide="panel-left-open" aria-hidden="true"></i>
      </button>
    </header>
    <nav class="sidebar-nav">
      <a href="index.html"><i data-lucide="home" aria-hidden="true"></i><span>Home</span></a>
      <a href="search.html"><i data-lucide="search" aria-hidden="true"></i><span>Search</span></a>
      <a href="categories.html" class="active" aria-current="page"><i data-lucide="compass" aria-hidden="true"></i><span>Explore</span></a>
      <a href="cart.html"><i data-lucide="shopping-cart" aria-hidden="true"></i><span>Cart</span></a>
      <a href="wallet.html"><i data-lucide="wallet" aria-hidden="true"></i><span>Wallet</span></a>
    </nav>
    <hr class="sidebar-divider" />
    <nav class="sidebar-nav secondary">
      <a href="help&amp;support.html"><i data-lucide="circle-help" aria-hidden="true"></i><span>Help &amp; Support</span></a>
    </nav>
    <div class="profile-section">
      <a class="profile-button" href="login.html" aria-label="Open profile">
        <span class="profile-avatar"><i data-lucide="user-round" aria-hidden="true"></i></span>
        <span class="profile-name">Profile</span>
      </a>
    </div>
  </aside>
  <main>
    <header class="explore-header">
      <a class="explore-title" href="index.html" aria-label="Sameep home"><img class="explore-logo" src="logo/sameep-animated.svg" alt="Sameep / समीप"></a>
      <hr class="explore-divider" aria-hidden="true">
      <h1>Explore</h1>
      <a class="github-link" href="https://github.com/vishwash03" target="_blank" rel="noopener noreferrer">
        GitHub <span aria-hidden="true">↗</span>
      </a>
    </header>
  </main>
  <script>
    lucide.createIcons();
    const sidebar = document.querySelector(".sidebar");
    const collapseBtn = document.getElementById("collapseBtn");

    collapseBtn.addEventListener("click", () => {
      const isCollapsed = sidebar.classList.toggle("collapsed");
      collapseBtn.setAttribute("aria-expanded", String(!isCollapsed));
      collapseBtn.setAttribute("aria-label", isCollapsed ? "Expand sidebar" : "Collapse sidebar");
      collapseBtn.innerHTML = `<i data-lucide="${isCollapsed ? "panel-left-open" : "panel-left-close"}" aria-hidden="true"></i>`;
      lucide.createIcons();
    });
  </script>
  <script src="site-sidebar.js"></script>
</body>

</html>
