<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Product</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="product-cards.css">
  <link rel="stylesheet" href="site-sidebar.css">
  <style>
    :root {
      --content-offset: 112px;
      --header-top: 24px;
      --header-height: 134px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #3a3330;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-content {
      width: calc(100vw - var(--content-offset));
      min-height: 100vh;
      padding: 150px 0 32px;
    }

    .header {
      position: fixed;
      z-index: 1000;
      top: var(--header-top);
      left: var(--content-offset);
      display: flex;
      width: calc(100vw - var(--content-offset) - 24px);
      height: var(--header-height);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 24px;
      background: #fff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .header h1,
    .header h4 {
      width: 100%;
      margin: 0;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .header h4 {
      margin-top: 4px;
      color: #8b7b77;
      font-size: 15px;
      font-weight: 500;
    }

    .header .header-divider {
      width: 100%;
      margin: 14px 0 8px;
      border: 0;
      border-top: 1px solid #e8d4c8;
    }

    .nav-tabs {
      display: flex;
      width: 100%;
      height: 40px;
      flex: 0 0 40px;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 4px;
      border: 1px solid #e8d4c8;
      border-radius: 8px;
      scrollbar-width: thin;
      scrollbar-color: #be8282 #f5e6d3;
    }

    .nav-tabs a {
      flex: 0 0 auto;
      padding: 6px 10px;
      color: #8b7b77;
      border-right: 1px solid #e8d4c8;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-tabs a.active,
    .nav-tabs a:hover {
      color: #3a3330;
      background: #f1e4d3;
    }

    .section-title {
      width: min(100%, 1240px);
      margin: 28px auto 12px;
      padding-bottom: 6px;
      color: #3a3330;
      border-bottom: 1px solid #e8d4c8;
      font-size: 18px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      :root {
        --content-offset: 80px;
        --header-top: 12px;
      }

      .header {
        padding-right: 24px;
        padding-left: 24px;
      }

      .header h1 {
        font-size: 22px;
      }

      .header h4 {
        margin-top: 2px;
        font-size: 12px;
      }

      .header .header-divider {
        margin: 8px 0 6px;
      }

      .nav-tabs a {
        padding: 6px 8px;
        font-size: 12px;
      }

      .section-title {
        margin-top: 18px;
      }
    }

    @media (max-width: 380px) {
      :root {
        --content-offset: 68px;
      }

      .header {
        padding-right: 8px;
        padding-left: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="main-content">
    <div class="content">
      <header class="header">
        <h1>NAME</h1>
        <h4>Location:------------</h4>
        <hr class="header-divider">
        <nav class="nav-tabs" aria-label="Main categories"></nav>
      </header>

      <h2 class="section-title">Featured Product</h2>
      <section class="products-container" aria-label="Featured products">
        <article class="card">
          <div class="card-image">
            <img src="image/p1.jpeg" alt="Premium Cloth">
            <button type="button" class="star-icon" title="Add to wishlist" aria-label="Add Premium Cloth to wishlist" aria-pressed="false">
              <i data-lucide="heart" aria-hidden="true"></i>
            </button>
          </div>
          <div class="card-content">
            <h3>Premium Cloth</h3>
            <div class="price-section">
              <span class="price-sale">₹400</span>
              <span class="price-original">₹600</span>
            </div>
            <div class="discount-badge-wrapper">
              <span class="discount-badge">₹200 OFF</span>
            </div>
            <span class="brand-badge">TrendStyle</span>
            <div class="rating-section">
              <span class="rating-badge">4.5★</span>
              <span class="review-count">(2.3k)</span>
            </div>
            <p class="product-size">200ml / Piece</p>
            <div class="quantity-control">
              <button type="button" class="qty-btn qty-minus" aria-label="Decrease quantity">−</button>
              <span class="qty-display">1</span>
              <button type="button" class="qty-btn qty-plus" aria-label="Increase quantity">+</button>
            </div>
            <button type="button" class="add-to-cart">Add to cart</button>
          </div>
        </article>
      </section>
    </div>
  </main>
  <script src="cart-storage.js"></script>
  <script>
    const card = document.querySelector(".card");
    const productName = card.querySelector("h3").textContent.trim();
    const addButton = card.querySelector(".add-to-cart");
    const quantityControl = card.querySelector(".quantity-control");
    const quantityDisplay = card.querySelector(".qty-display");

    function showCartError(error) {
      console.error("Product cart update failed.", error);
      window.alert(error.message);
    }

    try {
      const savedItem = window.ShopCart.getItems().find((item) => item.name === productName);
      if (savedItem) {
        quantityDisplay.textContent = String(savedItem.quantity);
        quantityControl.classList.add("show");
        addButton.classList.add("hidden");
      }
    } catch (error) {
      showCartError(error);
    }

    card.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.classList.contains("star-icon")) {
        button.classList.toggle("active");
        button.setAttribute("aria-pressed", String(button.classList.contains("active")));
        return;
      }

      try {
        const quantity = Number(quantityDisplay.textContent);
        if (button.classList.contains("add-to-cart") || button.classList.contains("qty-plus")) {
          window.ShopCart.add({
            name: productName,
            price: 400,
            image: card.querySelector(".card-image img").src,
            brand: "TrendStyle",
            size: "200ml / Piece"
          });
          quantityDisplay.textContent = String(button.classList.contains("add-to-cart") ? 1 : quantity + 1);
          if (button.classList.contains("add-to-cart")) {
            quantityControl.classList.add("show");
            addButton.classList.add("hidden");
          }
        } else if (button.classList.contains("qty-minus")) {
          const nextQuantity = quantity - 1;
          window.ShopCart.setQuantity(productName, nextQuantity);
          if (nextQuantity < 1) {
            quantityDisplay.textContent = "1";
            quantityControl.classList.remove("show");
            addButton.classList.remove("hidden");
          } else {
            quantityDisplay.textContent = String(nextQuantity);
          }
        }
      } catch (error) {
        showCartError(error);
      }
    });
  </script>
  <script src="site-sidebar.js"></script>
</body>
</html>
