<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #FCF8F2 0%, #F5E6D3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background-color: #FFFFFF;
            border-radius: 12px;
            border: 1px solid #E8D4C8;
            padding: 50px 40px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #3A3330;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #8B7B77;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            font-weight: 600;
            color: #3A3330;
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .phone-group {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .country-code-select {
            flex: 0 0 100px;
            padding: 12px 10px;
            border: 1.5px solid #E8D4C8;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #FAFAF8;
            color: #3A3330;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .country-code-select:hover {
            border-color: #D4B5A0;
        }

        .country-code-select:focus {
            outline: none;
            border-color: #BE8282;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(190, 130, 130, 0.1);
        }

        .form-input {
            padding: 12px 15px;
            width: 100%;
            border: 1.5px solid #E8D4C8;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Segoe UI', sans-serif;
            color: #3A3330;
            background-color: #FAFAF8;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #B8A89D;
        }

        .form-input:hover {
            border-color: #D4B5A0;
        }

        .form-input:focus {
            outline: none;
            border-color: #BE8282;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(190, 130, 130, 0.1);
        }

        .form-input[type="tel"] {
            letter-spacing: 1px;
        }

        .error-message {
            color: #D32F2F;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #BE8282;
        }

        .checkbox-group label {
            cursor: pointer;
            color: #3A3330;
            font-weight: 500;
        }

        .forgot-password {
            color: #BE8282;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #A0636B;
            text-decoration: underline;
        }

        .login-button {
            background: linear-gradient(135deg, #BE8282 0%, #A0636B 100%);
            color: #FFFFFF;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #A0636B 0%, #8B5559 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(190, 130, 130, 0.3);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        .login-button.loading {
            pointer-events: none;
        }

        .login-button.loading .loading-spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 24px;
            }

            .login-title {
                font-size: 24px;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to your account to continue</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="countryCode">Phone Number</label>
                    <div class="phone-group">
                        <select 
                            id="countryCode"
                            name="countryCode"
                            class="country-code-select"
                            title="Country code"
                            required
                        >
                            <option value="">Select</option>
                            <option value="+91" selected>🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+61">🇦🇺 +61</option>
                        </select>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="ENTER PHONE NUMBER"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            minlength="10"
                            class="form-input"
                            required
                            aria-label="Phone number"
                        >
                    </div>
                    <div class="error-message" id="phoneError"></div>
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-group">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            name="rememberMe"
                        >
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    <span class="loading-spinner"></span>
                    <span>LOGIN</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const phoneInput = document.getElementById('phone');
        const countryCodeSelect = document.getElementById('countryCode');
        const phoneError = document.getElementById('phoneError');
        const loginBtn = document.getElementById('loginBtn');

        // Form validation
        function validatePhone() {
            const phone = phoneInput.value.trim();
            const phonePattern = /^[0-9]{10}$/;

            if (!phone) {
                phoneError.textContent = 'Phone number is required';
                phoneError.classList.add('show');
                return false;
            }

            if (!phonePattern.test(phone)) {
                phoneError.textContent = 'Please enter a valid 10-digit phone number';
                phoneError.classList.add('show');
                return false;
            }

            phoneError.classList.remove('show');
            return true;
        }

        // Real-time validation on input
        phoneInput.addEventListener('input', () => {
            if (phoneInput.value) {
                validatePhone();
            }
        });

        phoneInput.addEventListener('blur', validatePhone);

        // Form submission
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!validatePhone()) {
                return;
            }

            const countryCode = countryCodeSelect.value;
            if (!countryCode) {
                phoneError.textContent = 'Please select a country code';
                phoneError.classList.add('show');
                return;
            }

            // Add loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                const fullPhone = countryCode + phoneInput.value;
                console.log('Login with:', fullPhone);
                
                // Redirect to OTP page
                window.location.href = 'OTP.html';
                
                // Reset loading state (if needed for back button)
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }, 800);
        });

        // Prevent non-numeric input
        phoneInput.addEventListener('keypress', (e) => {
            if (!/[0-9]/.test(e.key)) {
                e.preventDefault();
            }
        });
    </script>

</body>

</html>
