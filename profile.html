<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5f7">
  <title>Profile</title>
  <link rel="stylesheet" href="site-sidebar.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #3a3330;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
    }

    * {
      box-sizing: border-box;
    }

    body.profile-body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
      color: #3a3330;
    }

    .profile-page {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 28px 36px 36px;
    }

    .page-heading {
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .back-link {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      color: #34343b;
      background: #fff;
      border: 1px solid #e8d4c8;
      border-radius: 50%;
      text-decoration: none;
    }

    .back-link:hover {
      background: #f5e6d3;
    }

    .back-link svg {
      width: 19px;
      height: 19px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
    }

    .profile-identity {
      display: flex;
      min-height: 156px;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      padding: 28px;
      background: linear-gradient(115deg, #fff 0%, #f7e9df 100%);
      border: 1px solid #e8d4c8;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(86, 62, 48, 0.08);
    }

    .identity-avatar {
      display: grid;
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #cf9990, #a0636b);
      border: 4px solid #fff;
      border-radius: 22px;
      box-shadow: 0 4px 12px rgba(113, 69, 66, 0.16);
    }

    .identity-avatar svg {
      width: 29px;
      height: 29px;
      stroke-width: 1.8;
    }

    .identity-copy h2 {
      margin: 0 0 3px;
      color: #3a3330;
      font-size: 21px;
      font-weight: 700;
    }

    .identity-copy p {
      margin: 0;
      color: #8b7b77;
      font-size: 13px;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .quick-link {
      display: flex;
      min-height: 76px;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 14px;
      color: #3a3330;
      background: #fff;
      border: 1px solid #e8d4c8;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .quick-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 16px rgba(86, 62, 48, 0.1);
    }

    .quick-link svg {
      width: 21px;
      height: 21px;
      color: #a0636b;
      stroke-width: 1.8;
    }

    .balance-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px 16px;
      margin-bottom: 24px;
      padding: 18px 20px;
      color: #3a3330;
      background: linear-gradient(110deg, #f5e6d3, #f8eee5);
      border: 1px solid #e8d4c8;
      border-radius: 16px;
      text-decoration: none;
    }

    .balance-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .balance-title svg {
      width: 19px;
      height: 19px;
      color: #a0636b;
    }

    .balance-amount {
      grid-column: 1;
      color: #8b7b77;
      font-size: 12px;
    }

    .balance-amount strong {
      margin-left: 5px;
      color: #292a31;
      font-size: 15px;
    }

    .add-balance {
      grid-column: 2;
      grid-row: 1 / span 2;
      padding: 9px 13px;
      color: #3a3330;
      background: #fff;
      border: 1px solid #e8d4c8;
      border-radius: 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .profile-section {
      margin-bottom: 18px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.54);
      border: 1px solid rgba(232, 212, 200, 0.85);
      border-radius: 16px;
    }

    .profile-section h2 {
      margin: 0 0 12px 2px;
      color: #3a3330;
      font-size: 16px;
      font-weight: 700;
    }

    .menu-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
    }

    .menu-link {
      display: flex;
      min-height: 46px;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      color: #383941;
      border-bottom: 1px solid #f1e8e2;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .menu-link:last-child {
      border-bottom: 0;
    }

    .menu-link:hover {
      background: #fcf8f2;
    }

    .menu-icon {
      display: grid;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      place-items: center;
      color: #a0636b;
    }

    .menu-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.8;
    }

    .menu-label {
      min-width: 0;
      flex: 1;
    }

    .menu-label small {
      display: block;
      margin-top: 2px;
      color: #8b7b77;
      font-size: 10px;
    }

    .menu-link > svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      color: #a99a94;
    }

    .logout-link {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      color: #3a3330;
      background: #fff;
      border: 1px solid #e8d4c8;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .logout-link:hover {
      background: #fcf8f2;
    }

    a:focus-visible {
      outline: 2px solid #a0636b;
      outline-offset: 2px;
    }

    @media (max-width: 700px) {
      .profile-page {
        padding: 16px 14px 24px;
      }

      .page-heading {
        margin-bottom: 14px;
      }

      .quick-link {
        min-height: 70px;
        flex-direction: column;
        gap: 6px;
        padding: 10px 5px;
        font-size: 11px;
      }

      .profile-identity {
        min-height: 120px;
        gap: 14px;
        padding: 18px;
      }

      .identity-avatar {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        border-radius: 18px;
      }

      .identity-copy h2 {
        font-size: 18px;
      }

      .profile-section {
        padding: 14px 12px;
      }

      .menu-link {
        min-height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body class="site-sidebar-empty-page profile-body">
  <main class="profile-page">
    <header class="page-heading">
      <a class="back-link" href="index.html" aria-label="Back to home">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
      </a>
      <h1>Profile</h1>
    </header>

    <section class="profile-identity" aria-label="Account">
      <span class="identity-avatar" aria-hidden="true">
        <i data-lucide="user-round"></i>
      </span>
      <div class="identity-copy">
        <h2>Arjun tak</h2>
        <p>Welcome back! Manage your account.</p>
      </div>
    </section>

    <nav class="quick-links" aria-label="Profile shortcuts">
      <a class="quick-link" href="orderhistory.html">
        <i data-lucide="shopping-bag" aria-hidden="true"></i>
        <span>Your<br>Orders</span>
      </a>
      <a class="quick-link" href="help&support.html">
        <i data-lucide="messages-square" aria-hidden="true"></i>
        <span>Help &amp;<br>Support</span>
      </a>
      <a class="quick-link" href="wishlist.html">
        <i data-lucide="heart" aria-hidden="true"></i>
        <span>Your<br>Wishlist</span>
      </a>
    </nav>

    <a class="balance-card" id="profile-wallet-balance" href="wallet.html" aria-label="Demo wallet balance: zero rupees. Add demo money">
      <span class="balance-title">
        <i data-lucide="wallet-cards" aria-hidden="true"></i>
         Demo Wallet
      </span>
      <span class="balance-amount">Demo balance <strong id="profile-wallet-amount">₹0</strong></span>
      <span class="add-balance">Add demo money</span>
    </a>

    <section class="profile-section" aria-labelledby="account-heading">
      <h2 id="account-heading">Your Information</h2>
      <div class="menu-card">
        <a class="menu-link" href="wishlist.html">
          <span class="menu-icon"><i data-lucide="heart" aria-hidden="true"></i></span>
          <span class="menu-label">Your Wishlist</span>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </a>
        <a class="menu-link" href="help&support.html">
          <span class="menu-icon"><i data-lucide="messages-square" aria-hidden="true"></i></span>
          <span class="menu-label">Help &amp; Support</span>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </a>
        <a class="menu-link" href="Address.html">
          <span class="menu-icon"><i data-lucide="map-pin" aria-hidden="true"></i></span>
          <span class="menu-label">Saved Addresses<small>Manage your delivery addresses</small></span>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </a>
        <a class="menu-link" href="setting.html">
          <span class="menu-icon"><i data-lucide="circle-user-round" aria-hidden="true"></i></span>
          <span class="menu-label">Edit Profile</span>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </a>
        <a class="menu-link" href="payment.html">
          <span class="menu-icon"><i data-lucide="credit-card" aria-hidden="true"></i></span>
          <span class="menu-label">Payment Management</span>
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </a>
      </div>
    </section>

    <a class="logout-link" href="login.html">Log Out</a>
  </main>

  <script src="account-pages.js"></script>
  <script src="site-sidebar.js"></script>
</body>
</html>
