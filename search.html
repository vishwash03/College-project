<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebars</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 24px;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #3a3330;
      transition: background 0.3s;
    }

    .main-content {
      width: 100%;
      min-height: 100vh;
      padding: 150px 40px 32px;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      height: 134px;
      width: calc(100% - 300px);
      max-width: 1100px;
      padding: 4px 24px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .searchbox {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .searchbox input {
      width: min(600px, 100%);
      height: 35px;
      padding: 12px 15px;
      border: 1.5px solid #E8D4C8;
      border-radius: 6px;
      font-size: 15px;
      font-family: 'Segoe UI', sans-serif;
      color: #3A3330;
      background-color: #FAFAF8;
      transition: all 0.3s ease;
    }

    .searchbox input::placeholder {
      color: #B8A89D;
    }

    .searchbox input:hover {
      border-color: #D4B5A0;
    }

    .searchbox input:focus {
      outline: none;
      border-color: #BE8282;
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(190, 130, 130, 0.1);
    }

    .header h1 {
      width: 100%;
      margin: 0;
      color: #3a3330;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .header h4 {
      width: 100%;
      margin: 4px 0 0;
      color: #8b7b77;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    .header .divider {
      width: 100%;
      margin: 14px 0 8px;
    }

    .nav-tabs {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      height: auto;
      min-height: 40px;
      overflow-x: auto;
      overflow-y: visible;
      white-space: nowrap;
      scroll-behavior: smooth;
    }
    .nav-tabs::-webkit-scrollbar{
      display: none;
    }
    .nav-tabs{
      scrollbar-width:none;
    }
    .nav-tabs a{
      flex:0 0 auto;
      white-space: nowrap;
    }

    .nav-tabs a {
      padding: 6px 10px;
      border-right: 1px solid #e8d4c8;
      border-radius: 8px;
      color: #8b7b77;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .nav-tabs a:hover,
    .nav-tabs a.active {
      background: #f1e4d3;
      color: #3a3330;
    }

    .nav-tabs a:last-child {
      border-right: 0;
    }

    .sidebar {
      position: fixed;
      z-index: 2;
      width: 250px;
      top: 24px;
      left: 24px;
      bottom: 32px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition:
        width 0.35s ease,
        background 0.3s,
        box-shadow 0.3s;
    }

    .sidebar.collapsed {
      width: 64px;
    }

    .sidebar-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 8px;
      overflow: hidden;
    }

    /* Header */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      margin-bottom: 16px;
    }

    .collapse-btn {
      position: absolute;
      top: 12px;
      right: 8px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: #be8282;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .collapse-btn:hover {
      background: #a0636b;
    }

    .nav {
      list-style: none;
      margin: 0 0 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;

      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 14px;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #3a3330;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav button span:not(.app-icon) {
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav button:hover {
      background: #f5e6d3;
    }

    .nav button.active {
      background: #f1e4d3;
    }

    /* Divider */
    .divider {
      height: 1px;
      border: 0;
      margin: 10px 4px 14px;
      background: #e8d4c8;
    }

    /* App icons */
    .app-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin: 0 -3px;
      border-radius: 8px;
      background: #fafaf8;
    }

    .app-icon svg {
      width: 18px;
      height: 18px;
    }

    .app-icon-dark {
      background: #3a3330;
    }

    .profile-section {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #e8d4c8;
    }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 12px;
      background: transparent;
      color: #3a3330;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .profile-button:hover {
      background: #f5e6d3;
    }

    .profile-button.active {
      background: #f1e4d3;
    }

    .profile-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #be8282;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar.collapsed .profile-button {
      justify-content: center;
      padding: 0;
    }

    .sidebar.collapsed .profile-name {
      display: none;
    }

    /* Lucide icon sizing */
    .sidebar .lucide {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }
    .searchbox input{
            padding: 12px 15px;
            width: 600px;
            height: 35px;
            border: 1.5px solid #E8D4C8;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Segoe UI', sans-serif;
            color: #3A3330;
            background-color: #FAFAF8;
            transition: all 0.3s ease;
    }
     .searchbox input::placeholder {
            color: #B8A89D;
        }

        .searchbox input:hover {
            border-color: #D4B5A0;
        }

        .searchbox input:focus {
            outline: none;
            border-color: #BE8282;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(190, 130, 130, 0.1);
        }
  </style>
</head>

<body>
  <!-- This is sidebar like(nav bar) -->
  <aside class="sidebar collapsed">
    <div class="sidebar-inner">
      <header class="sidebar-header">
        <button type="button" class="collapse-btn" id="collapseBtn" aria-label="Toggle sidebar">
          <i data-lucide="panel-left"></i>
        </button>
      </header>

      <ul class="nav">
        <li>
          <button type="button"  data-page="index.html">
            <i data-lucide="house" ></i>
            <span>HOME</span>
          </button>
        </li>
        <li>
          <button type="button" class="active" data-page="search.html">
            <i data-lucide="search"></i>
            <span>Search</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="categories.html">
            <i data-lucide="compass"></i>
            <span>Categories</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="cart.html">
            <i data-lucide="shopping-cart"></i>
            <span>Cart</span>
          </button>
        </li>
        <li>
          <button type="button" data-page="wallet.html ">
            <i data-lucide="wallet"></i>
            <span>Wallet</span>
          </button>
        </li>
      </ul>

      <hr class="divider" />

      <ul class="nav apps">
        <li>
          <button type="button" data-page="help.html">
            <i data-lucide="help-circle"></i>
            <span>help & Support</span>
          </button>
        </li>


      </ul>

      <div class="profile-section">
        <button type="button" class="profile-button" aria-label="Open profile">
          <span class="profile-avatar">A</span>
          <span class="profile-name">Profile</span>
        </button>
      </div>

    </div>
  </aside>
  <main class="main-content">
    <div class="content">
      <div class="header">
        <h1>NAME</h1>
        <h4>Location:------------</h4>
        <hr class="divider" />
        <nav class="nav-tabs">
          <a href="#" class="active">🛍️ All</a>
          <a href="#">☕ Cafe</a>
          <a href="#">🏠 Home</a>
          <a href="#">🎮 Toys</a>
          <a href="#">🥬 Fresh</a>
          <a href="#">🎧 Electronics</a>
          <a href="#">📱 Mobiles</a>
          <a href="#">💄 Beauty</a>
          <a href="#">👗 Fashion</a>
          <a href="#">🎮 Toys</a>
          <a href="#">🥬 Fresh</a>
          <a href="#">Skincare</a>
          <a href="#">Baby Product</a>
          <a href="#">Special</a>
          <a href="#">Men's</a>
        </nav>
      </div>

    </div>
  </main>
  <script>
    const sidebar = document.querySelector(".sidebar");
    const collapseBtn = document.getElementById("collapseBtn");

    collapseBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });

    function setActiveButton(button) {
      document
        .querySelectorAll(".nav button, .profile-button")
        .forEach((item) => {
          item.classList.remove("active");
          item.removeAttribute("aria-current");
        });
      button.classList.add("active");
      button.setAttribute("aria-current", "page");
    }

    document.querySelectorAll(".nav button").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveButton(button);

        const page = (button.dataset.page || "").trim();
        if (page) {
          window.location.href = page;
        }
      });
    });

    const currentPage = (window.location.pathname.split("/").pop() || "index.html").trim().toLowerCase();
    const currentSidebarButton = [...document.querySelectorAll(".nav button")].find((button) => {
      const page = (button.dataset.page || "").trim().toLowerCase();
      return page === currentPage;
    });

    if (currentSidebarButton) {
      setActiveButton(currentSidebarButton);
    } else {
      const homeButton = document.querySelector('.nav button[data-page="index.html"]');
      if (homeButton) setActiveButton(homeButton);
    }

    document.querySelector(".profile-button").addEventListener("click", (event) => {
      setActiveButton(event.currentTarget);
      window.location.href = "login.html";
    });

    lucide.createIcons();
  </script>
</body>

</html>
