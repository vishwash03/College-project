<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebars</title>
  <link rel="stylesheet" href="styles.css" />
   <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Global reset and page background */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding-left: 24px;
      background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #3a3330;
      transition: background 0.3s;
    }

    /* Main page area */
    .main-content {
      width: 100%;
      min-height: 100vh;
      padding: 150px 40px 32px;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Top page header */
    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      height: 134px;
      width: calc(100% - 80px);
      max-width: 1100px;
      padding: 4px 24px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .header h1 {
      width: 100%;
      margin: 0;
      color: #3a3330;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .header h4 {
      width: 100%;
      margin: 4px 0 0;
      color: #8b7b77;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    .header .divider {
      width: 100%;
      margin: 14px 0 8px;
    }

    .nav-tabs {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      height: auto;
      min-height: 40px;
      overflow-x: auto;
      overflow-y: visible;
      white-space: nowrap;
      scroll-behavior: smooth;
    }
    .nav-tabs::-webkit-scrollbar{
      display: none;
    }
    .nav-tabs{
      scrollbar-width:none;
    }
    .nav-tabs a{
      flex:0 0 auto;
      white-space: nowrap;
    }

    .nav-tabs a {
      padding: 6px 10px;
      border-right: 1px solid #e8d4c8;
      border-radius: 8px;
      color: #8b7b77;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .nav-tabs a:hover,
    .nav-tabs a.active {
      background: #f1e4d3;
      color: #3a3330;
    }

    .nav-tabs a:last-child {
      border-right: 0;
    }

    /* Sidebar layout */
    .sidebar {
      position: fixed;
      z-index: 5;
      width: 250px;
      top: 24px;
      left: 24px;
      bottom: 32px;
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition:
        width 0.35s ease,
        background 0.3s,
        box-shadow 0.3s;
        margin-left:80px;
    }

    .sidebar.collapsed {
      width: 64px;
    }

    .sidebar-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 8px;
      overflow: hidden;
    }

    /* Sidebar header and toggle button */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      margin-bottom: 16px;
    }

    .collapse-btn {
      position: absolute;
      top: 12px;
      right: 8px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: #be8282;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .collapse-btn:hover {
      background: #a0636b;
    }

    /* Sidebar navigation menu */
    .nav {
      list-style: none;
      margin: 0 0 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;

      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 14px;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #3a3330;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav button span:not(.app-icon) {
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav button:hover {
      background: #f5e6d3;
    }

    .nav button.active {
      background: #f1e4d3;
    }

    /* Divider */
    .divider {
      height: 1px;
      border: 0;
      margin: 10px 4px 14px;
      background: #e8d4c8;
    }

    /* App icons */
    .app-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin: 0 -3px;
      border-radius: 8px;
      background: #fafaf8;
    }

    .app-icon svg {
      width: 18px;
      height: 18px;
    }

    .app-icon-dark {
      background: #3a3330;
    }

    /* Profile area at the bottom of the sidebar */
    .profile-section {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #e8d4c8;
    }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 12px;
      background: transparent;
      color: #3a3330;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .profile-button:hover {
      background: #f5e6d3;
    }

    .profile-button.active {
      background: #f1e4d3;
    }

    .profile-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #be8282;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar.collapsed .profile-button {
      justify-content: center;
      padding: 0;
    }

    .sidebar.collapsed .profile-name {
      display: none;
    }

    /* Lucide icon sizing */
    .sidebar .lucide {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }
    
    /* SVG icon styling */
    .sidebar-icon {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    
    /* Lucide sidebar icons */
    .nav i[data-lucide],
    .collapse-btn i[data-lucide] {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .card{
            width: 100%;
            padding: 8px;
            background: #fcf9f5;
            border: 1px solid #e8d4c8;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0, .04);
            transition: .4s ease;
        }
        .card:hover{
            background: #faf6f1;
            border-color: #d4bfb5;
            box-shadow: 0 8px 24px rgba(190, 130, 130, 0.15);
        }
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 32px;
        }
        .card .card-image{
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 0;
            text-align: center;
            background: linear-gradient(135deg, #f5e6d3 0%, #fcf8f2 100%);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e8d4c8;
        }
        .card .card-image img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .4s ease;
            border-radius: 12px;
        }
        .card:hover .card-image img{
            transition:.4s ease;
        }
        .card .card-image .star-icon{
            cursor: pointer;
            position: absolute;
            top:8px;
            right:8px;
            padding: 6px;
            width: 32px;
            height: 32px;
            color:#ffffff;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius:50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            display: grid;
            place-items: center;
            backdrop-filter: blur(1px);
        }
        .card:hover .card-image .star-icon{
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 1);
            color: #be8282;
        }
        .card .card-image .star-icon.active {
            color: #ff4d4d;
            background: transparent;
            border: none;
            box-shadow: none;
            transform: none;
        }
        .card .card-image .star-icon.active svg {
            fill: #ff4d4d;
            stroke: #ff4d4d;
            stroke-width: 1.5;
        }

        /* Wishlist icon size */
        .card .card-image .star-icon svg {
            width: 16px;
            height: 16px;
        }

        /* Product card content layout */
        .card .card-content {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0;
        }

        .card .card-content h3{
            color:#3a3330;
            font-size:13px;
            font-weight: 600;
            margin: 5px 0 0;
            line-height: 1.2;
            flex: 0 0 55%;
            word-wrap: break-word;
            min-height: 30px;
        }
        .card .card-content .price{
            color:#f7ae04;
            font-size: 14px;
            font-weight:600;
            margin:0 0 4px;
        }
        .card .card-content p{
            color:#8b7b77;
            font-size: 11px;
            font-weight:500;
            margin:2px 0 8px;
            text-align: justify;
        }

        /* Price Section */
        .price-section {
            display: flex;
            flex-direction: column;
            gap: 0;
            align-items: flex-end;
            justify-content: flex-start;
            flex: 0 0 40%;
            margin: 5px 0 0;
            padding-left: 4px;
            text-align: right;
            min-height: 30px;
        }
        .price-sale {
            color: #3a3330;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }
        .price-original {
            color: #8b7b77;
            font-size: 10px;
            text-decoration: line-through;
            line-height: 1;
        }

        /* Discount Badge - new line */
        .discount-badge-wrapper {
            display: block;
            flex: 0 0 100%;
            margin: 3px 0 2px;
            min-height: 14px;
        }
        .discount-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            display: inline-block;
        }

        /* Product Info */
        .product-size {
            color: #8b7b77;
            font-size: 10px;
            margin: 2px 0 0;
            flex: 0 0 100%;
            min-height: 12px;
            line-height: 1.2;
        }
        .brand-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            margin: 0 0 3px;
            flex: 0 0 100%;
            min-height: 16px;
            line-height: 1.4;
        }

        /* Rating */
        .rating-section {
            display: flex;
            gap: 4px;
            align-items: center;
            margin: 3px 0 0;
            font-size: 10px;
            flex: 0 0 100%;
            min-height: 16px;
        }
        .rating-badge {
            background: #4caf50;
            color: #ffffff;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
        }
        .review-count {
            color: #8b7b77;
            font-size: 9px;
        }

        /* Quantity selector for compact product card */
        .quantity-control{
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 4px 0 0;
            background: #f9f5f1;
            border: 1px solid #e8d4c8;
            border-radius: 999px;
            padding: 4px 8px;
            height: 30px;
            flex: 0 0 100%;
            box-sizing: border-box;
        }
        .quantity-control.show{
            display: flex;
        }

        /* Small circular +/- buttons inside quantity control */
        .card .card-content .quantity-control .qty-btn{
            width: 20px;
            height: 20px;
            min-width: 20px;
            min-height: 20px;
            border: none;
            background: #be8282;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 0.8;
            font-weight: 700;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
            flex: 0 0 auto;
        }
        .card .card-content .quantity-control .qty-btn:hover{
            background: #a0636b;
            transform: scale(1.05);
        }
        .card .card-content .quantity-control .qty-btn:active{
            transform: scale(0.95);
        }
        .qty-display{
            min-width: 18px;
            text-align: center;
            font-weight: 600;
            color: #3a3330;
            font-size: 10px;
        }
        .card .card-content button{
            cursor:pointer;
            color:#fff;
            width: 100%;
            height: 28px;
            font-size: 11px;
            font-weight:600;
            border-radius: 6px;
            border: none;
            flex: 0 0 100%;
            margin-top: 3px;
            background:linear-gradient(
                45deg,#be8282,#a0636b
            );
            transition: all 0.2s ease;
            padding: 0 8px;
            line-height: 1;
        }
        .card .card-content .quantity-control .qty-display{
            min-width: 18px;
            text-align: center;
            font-weight: 600;
            color: #3a3330;
            font-size: 10px;
            flex: 0 0 auto;
        }
        .card .card-content button.hidden{
            display: none;
        }
        .card .card-content button:hover{
            transform: scale(1.02);
            background:linear-gradient(
                45deg,#a0636b,#8b5563
            );
        }

    /* Wallet Page Styles */
    .wallet-section {
      margin-bottom: 32px;
    }

    /* Balance Card */
    .balance-card {
      background: linear-gradient(135deg, #be8282 0%, #a0636b 100%);
      border-radius: 16px;
      padding: 32px 24px;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(190, 130, 130, 0.3);
      margin-bottom: 24px;
    }

    .balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .balance-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
    }

    .balance-amount {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .balance-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 16px;
    }

    .last-updated {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }

    /* Wallet Action Buttons */
    .wallet-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      background: #ffffff;
      border: 2px solid #e8d4c8;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #3a3330;
      transition: all 0.3s ease;
      min-height: 100px;
    }

    .action-btn:hover {
      background: #f9f5f1;
      border-color: #be8282;
      box-shadow: 0 4px 12px rgba(190, 130, 130, 0.15);
      transform: translateY(-2px);
    }

    .action-btn i {
      color: #be8282;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e8d4c8;
    }

    .section-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #3a3330;
    }

    .view-all,
    .add-method-btn {
      color: #be8282;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .view-all:hover,
    .add-method-btn:hover {
      color: #a0636b;
    }

    /* Transactions Section */
    .transactions-section {
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: #fcf9f5;
      border-radius: 12px;
      border: 1px solid #e8d4c8;
      transition: all 0.2s ease;
    }

    .transaction-item:hover {
      background: #faf6f1;
      border-color: #d4bfb5;
    }

    .transaction-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      color: #ffffff;
    }

    .transaction-icon.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .transaction-icon.debit {
      background: #ffebee;
      color: #c62828;
    }

    .transaction-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 1;
      gap: 16px;
    }

    .transaction-description h4 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 600;
      color: #3a3330;
    }

    .transaction-description .transaction-meta {
      margin: 0;
      font-size: 13px;
      color: #8b7b77;
    }

    .transaction-amount {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .transaction-amount.success {
      color: #2e7d32;
    }

    .transaction-amount.debit {
      color: #c62828;
    }

    .transaction-time {
      font-size: 12px;
      color: #8b7b77;
      white-space: nowrap;
    }

    /* Payment Methods Section */
    .payment-methods-section {
      background: #ffffff;
      border: 1px solid #e8d4c8;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .payment-methods-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .payment-method-card {
      background: linear-gradient(135deg, #f5e6d3 0%, #fcf8f2 100%);
      border: 2px solid #e8d4c8;
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: all 0.3s ease;
    }

    .payment-method-card:hover {
      border-color: #be8282;
      box-shadow: 0 8px 24px rgba(190, 130, 130, 0.15);
      transform: translateY(-4px);
    }

    .card-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-weight: 600;
      color: #3a3330;
    }

    .card-brand i {
      color: #be8282;
    }

    .card-number {
      font-size: 18px;
      font-weight: 600;
      color: #3a3330;
      margin: 0 0 16px 0;
      letter-spacing: 2px;
    }

    .card-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 12px;
      color: #8b7b77;
    }

    .card-holder {
      font-weight: 600;
    }

    .default-badge {
      display: inline-block;
      background: #4caf50;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .card-action-btn {
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid #e8d4c8;
      border-radius: 8px;
      color: #be8282;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card-action-btn:hover {
      background: #be8282;
      border-color: #be8282;
      color: #ffffff;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .wallet-actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .transaction-details {
        flex-direction: column;
        align-items: flex-start;
      }

      .transaction-time {
        align-self: flex-start;
      }

      .balance-amount {
        font-size: 36px;
      }

      .payment-methods-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    const sidebar = document.querySelector(".sidebar");
    const collapseBtn = document.getElementById("collapseBtn");

    collapseBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });

    function setActiveButton(button) {
      document
        .querySelectorAll(".nav button, .profile-button")
        .forEach((item) => {
          item.classList.remove("active");
          item.removeAttribute("aria-current");
        });
      button.classList.add("active");
      button.setAttribute("aria-current", "page");
    }

    document.querySelectorAll(".nav button").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveButton(button);

        const page = (button.dataset.page || "").trim();
        if (page) {
          window.location.href = page;
        }
      });
    });

    const currentPage = (window.location.pathname.split("/").pop() || "index.html").trim().toLowerCase();
    const currentSidebarButton = [...document.querySelectorAll(".nav button")].find((button) => {
      const page = (button.dataset.page || "").trim().toLowerCase();
      return page === currentPage;
    });

    if (currentSidebarButton) {
      setActiveButton(currentSidebarButton);
    } else {
      const homeButton = document.querySelector('.nav button[data-page="index.html"]');
      if (homeButton) setActiveButton(homeButton);
    }

    document.querySelector(".profile-button").addEventListener("click", (event) => {
      setActiveButton(event.currentTarget);
      window.location.href = "login.html";
    });

    // Wallet page interactions
    document.querySelectorAll(".action-btn").forEach((btn) => {
      btn.addEventListener("click", function() {
        const action = this.className.match(/\b(add-money|transfer|withdraw|request)\b-btn/)?.[1];
        if (action) {
          alert(`${action.charAt(0).toUpperCase() + action.slice(1)} feature will be available soon!`);
        }
      });
    });

    document.querySelectorAll(".card-action-btn").forEach((btn) => {
      btn.addEventListener("click", function(e) {
        e.preventDefault();
        if (this.textContent.trim() === "Remove") {
          this.parentElement.style.opacity = "0.5";
          this.textContent = "Removed";
          this.disabled = true;
        }
      });
    });

    // Initialize Lucide icons
    lucide.createIcons();
  </script>
